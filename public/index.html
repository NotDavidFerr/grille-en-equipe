<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Grille en Équipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EDE6D6;
    --paper-dark: #E2D9C4;
    --ink: #2B3A55;
    --ink-soft: #55524C;
    --amber: #C98A3A;
    --green: #4F7959;
    --blue: #4468A6;
    --plum: #A6467A;
    --coral: #B54B3A;
    --black-cell: #2B2620;
    --line: #d8cdb2;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--paper);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    overscroll-behavior: none;
  }
  body{
    background-image:
      radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 1px);
    background-size: 22px 22px;
  }
  h1,h2,h3,.display{
    font-family: 'Fraunces', serif;
    color: var(--ink);
    margin: 0;
  }
  #app{
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 18px 16px 28px;
  }

  .brand{ display:flex; align-items:baseline; gap:10px; margin-bottom: 22px; }
  .brand .display{ font-size: 26px; font-weight:700; letter-spacing: -0.01em;}
  .brand .tag{ font-size: 13px; color: var(--ink-soft); font-style: italic; }

  .btn{
    font-family:'Inter', sans-serif; font-weight:600; font-size:15px;
    border:none; border-radius:10px; padding:14px 18px;
    background: var(--ink); color: var(--paper);
    cursor:pointer; width:100%;
    transition: transform .12s ease;
  }
  .btn:active{ transform: scale(0.97); }
  .btn:disabled{ opacity:0.55; }
  .btn.secondary{ background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }
  .btn.amber{ background: var(--amber); color: #2b2210; }
  .field{
    width:100%; font-size:16px; font-family:'Inter',sans-serif;
    padding: 13px 14px; border-radius: 10px; border: 1.5px solid var(--line);
    background: #fbf8f0; color: var(--ink); margin-bottom: 12px;
  }
  .field:focus{ outline: 2px solid var(--amber); border-color: transparent; }
  label.small{ font-size:12.5px; color: var(--ink-soft); display:block; margin: 0 0 6px 2px; }

  .card{
    background: #fbf8f0; border: 1.5px solid var(--line);
    border-radius: 16px; padding: 20px; margin-bottom: 14px;
  }
  .card h2{ font-size:18px; margin-bottom: 12px; }
  .divider{
    display:flex; align-items:center; gap:10px; margin: 18px 0;
    color: var(--ink-soft); font-size:12px;
  }
  .divider::before, .divider::after{ content:''; flex:1; height:1px; background: var(--line); }

  .room-code{
    font-family:'Fraunces', serif; font-size: 40px; font-weight:700;
    letter-spacing: 0.12em; text-align:center; color: var(--ink);
    background: #fbf8f0; border: 1.5px dashed var(--ink-soft);
    border-radius: 14px; padding: 16px; margin: 14px 0;
  }
  .players-list{ display:flex; flex-direction:column; gap:8px; margin: 14px 0; }
  .player-row{
    display:flex; align-items:center; gap:10px; background:#fbf8f0;
    border-radius: 10px; padding: 10px 12px; border:1px solid var(--line);
  }
  .avatar{
    width: 30px; height:30px; border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    color: #fff; font-weight:700; font-size: 13px; flex-shrink:0;
  }
  .host-tag{ font-size:11px; color: var(--ink-soft); margin-left:auto; font-style: italic; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 14px; gap: 10px; }
  .stat{ background:#fbf8f0; border:1px solid var(--line); border-radius:10px; padding: 8px 12px; text-align:center; flex:1; }
  .stat .num{ font-family:'Fraunces',serif; font-size:20px; font-weight:700; }
  .stat .lbl{ font-size:10.5px; color: var(--ink-soft); }
  .avatars-row{ display:flex; gap:6px; margin-bottom: 12px; }
  .avatars-row .avatar{ width:26px; height:26px; font-size:11px; border: 2px solid var(--paper); }

  .grid-wrap{ overflow-x: auto; padding: 4px 0 10px; -webkit-overflow-scrolling: touch; }
  .grid{ display: grid; gap: 3px; width: max-content; margin: 0 auto; background: var(--ink); padding: 3px; border-radius: 8px; }
  .cell{ width: 44px; height: 44px; display:flex; align-items:center; justify-content:center; position: relative; }
  .cell.black{ background: var(--black-cell); border-radius: 3px; }
  .cell.clue{ background: var(--amber); color: #2b2210; border-radius: 3px; font-size: 8.2px; line-height: 1.05; text-align:left; padding: 3px 4px; font-weight:600; overflow:hidden; cursor:pointer; }
  .cell.clue.active{ outline: 2.5px solid var(--ink); outline-offset: -2.5px; }
  .cell.clue .arrow{ position:absolute; font-size: 13px; font-weight:700; right:3px; bottom:2px; }
  .cell.letter{ background: #fbf8f0; border-radius: 3px; cursor: pointer; user-select: none; }
  .cell.letter.active{ background: #fff0c9; }
  .cell.letter.current{ background: #ffe08a; box-shadow: inset 0 0 0 2px var(--ink); }
  .cell.letter .letter-text{
    font-family:'Fraunces',serif; font-size: 19px; font-weight:600; color: var(--ink);
    text-transform: uppercase; line-height:1;
  }
  .cell.letter.correct{ background: #e4efe6; }
  .cell.letter.correct .letter-text{ color: var(--green); }
  .cell.letter .dot{ position:absolute; bottom:2px; right:2px; width:7px; height:7px; border-radius:50%; }
  .hidden-input{
    position: fixed; top: -1000px; left: -1000px;
    width: 1px; height: 1px; opacity: 0; border: none; padding: 0;
    font-size: 16px; /* évite le zoom automatique sur iOS */
  }

  .clue-banner{ background: var(--ink); color: var(--paper); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; font-size: 13.5px; display:flex; align-items:center; gap:10px; min-height: 20px; }
  .clue-banner .arrow{ font-size:16px; color: var(--amber); flex-shrink:0; }

  .result{ text-align:center; padding: 30px 10px; }
  .result .score{ font-family:'Fraunces',serif; font-size: 64px; font-weight:700; color: var(--amber); margin: 10px 0; }
  .footer-note{ text-align:center; color: var(--ink-soft); font-size: 12px; margin-top: 18px; }
  .error-text{ color:var(--coral); font-size:13px; margin:10px 0 0; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  // Les grilles sont chargées dynamiquement depuis le serveur (voir data/puzzles.json),
  // pas codées en dur ici — ça permet d'en ajouter sans toucher ce fichier.
  let PUZZLES = [];
  let puzzlesPromise = null;
  function ensurePuzzlesLoaded(){
    if(!puzzlesPromise){
      puzzlesPromise = api('/api/puzzles')
        .then(list => { PUZZLES = Array.isArray(list) ? list : []; })
        .catch(() => { PUZZLES = []; });
    }
    return puzzlesPromise;
  }


  function buildGridMap(puzzle){
    const map = {};
    for(let r=0;r<puzzle.rows;r++){
      for(let c=0;c<puzzle.cols;c++){
        const key = r+'-'+c;
        map[key] = puzzle.cells[key] || {type:'black'};
      }
    }
    return map;
  }

  // For each clue cell, list the ordered cells that form its word.
  function computeWords(puzzle){
    const words = [];
    Object.keys(puzzle.cells).forEach(key => {
      const def = puzzle.cells[key];
      if(def.type !== 'clue') return;
      const [r,c] = key.split('-').map(Number);
      const cells = [];
      if(def.dir === 'right'){
        let cc = c+1;
        while(cc < puzzle.cols && puzzle.cells[r+'-'+cc] && puzzle.cells[r+'-'+cc].type === 'letter'){
          cells.push(r+'-'+cc); cc++;
        }
      } else {
        let rr = r+1;
        while(rr < puzzle.rows && puzzle.cells[rr+'-'+c] && puzzle.cells[rr+'-'+c].type === 'letter'){
          cells.push(rr+'-'+c); rr++;
        }
      }
      words.push({ id: key, dir: def.dir, text: def.text, cells });
    });
    return words;
  }

  const state = {
    screen: 'home',
    code: null,
    myId: null,
    myColor: null,
    room: null,
    pollTimer: null,
    tickTimer: null,
    error: null,
    busy: false,
    activeWordId: null,
    cursorIndex: 0,
  };

  async function api(path, opts){
    const res = await fetch(path, opts);
    if(!res.ok){
      const err = new Error('http_' + res.status);
      err.status = res.status;
      throw err;
    }
    return res.json();
  }

  async function pollRoom(){
    if(!state.code) return;
    try{
      const fresh = await api('/api/rooms/' + state.code);
      state.room = fresh;
      if(fresh.status === 'playing' && state.screen === 'lobby') state.screen = 'game';
      if(fresh.status === 'finished' && state.screen !== 'end') state.screen = 'end';
      render();
    }catch(e){ /* connexion momentanément indisponible, on réessaiera */ }
  }

  function startPolling(){ stopPolling(); state.pollTimer = setInterval(pollRoom, 1300); }
  function stopPolling(){ if(state.pollTimer){ clearInterval(state.pollTimer); state.pollTimer = null; } }
  function startTicking(){ stopTicking(); state.tickTimer = setInterval(() => { if(state.room && state.room.status === 'playing') render(); }, 1000); }
  function stopTicking(){ if(state.tickTimer){ clearInterval(state.tickTimer); state.tickTimer = null; } }

  async function createRoom(name){
    state.error = null; state.busy = true; render();
    try{
      await ensurePuzzlesLoaded();
      const room = await api('/api/rooms', { method:'POST' });
      const joined = await api('/api/rooms/' + room.code + '/join', {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name })
      });
      state.code = room.code;
      state.myId = joined.playerId;
      const me = joined.room.players.find(p => p.id === joined.playerId);
      state.myColor = me ? me.color : null;
      state.room = joined.room;
      state.screen = 'lobby';
      startPolling();
    }catch(e){
      state.error = "Impossible de contacter le serveur. Vérifie que 'node server.js' tourne toujours et que tu es bien connecté à son Wifi.";
    }
    state.busy = false;
    render();
  }

  async function joinRoom(code, name){
    code = code.toUpperCase().trim();
    state.error = null; state.busy = true; render();
    try{
      await ensurePuzzlesLoaded();
      const joined = await api('/api/rooms/' + code + '/join', {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name })
      });
      state.code = code;
      state.myId = joined.playerId;
      const me = joined.room.players.find(p => p.id === joined.playerId);
      state.myColor = me ? me.color : null;
      state.room = joined.room;
      state.screen = joined.room.status === 'playing' ? 'game' : (joined.room.status === 'finished' ? 'end' : 'lobby');
      startPolling();
    }catch(e){
      state.error = (e.status === 404)
        ? "Cette partie n'existe pas. Vérifie le code, ou que tu es connecté au bon serveur."
        : "Impossible de contacter le serveur. Vérifie le Wifi et l'adresse utilisée.";
    }
    state.busy = false;
    render();
  }

  async function launchGame(){
    try{
      state.room = await api('/api/rooms/' + state.code + '/start', { method:'POST' });
      startTicking();
      state.screen = 'game';
    }catch(e){ state.error = "Impossible de lancer la partie pour le moment."; }
    render();
  }

  async function playAgain(){
    try{
      state.room = await api('/api/rooms/' + state.code + '/reset', { method:'POST' });
      state.screen = 'lobby';
    }catch(e){ state.error = "Impossible de relancer une partie pour le moment."; }
    render();
  }

  function getPuzzle(){
    const id = state.room ? state.room.puzzleId : PUZZLES[0].id;
    return PUZZLES.find(p => p.id === id) || PUZZLES[0];
  }

  function getActiveWord(){
    const puzzle = getPuzzle();
    const words = computeWords(puzzle);
    return words.find(w => w.id === state.activeWordId) || null;
  }

  function firstEmptyIndex(word){
    const grid = (state.room && state.room.grid) || {};
    for(let i=0;i<word.cells.length;i++){
      if(!grid[word.cells[i]]) return i;
    }
    return 0;
  }

  function focusHiddenInput(){
    const el = document.getElementById('cell-input');
    if(el) el.focus({ preventScroll: true });
  }

  function selectWord(wordId, atIndex){
    const puzzle = getPuzzle();
    const words = computeWords(puzzle);
    const word = words.find(w => w.id === wordId);
    if(!word) return;
    state.activeWordId = wordId;
    state.cursorIndex = (typeof atIndex === 'number') ? atIndex : firstEmptyIndex(word);
    applyActiveWordHighlight();
    focusHiddenInput();
  }

  function selectCell(key){
    const puzzle = getPuzzle();
    const words = computeWords(puzzle);
    let word = words.find(w => w.id === state.activeWordId && w.cells.includes(key));
    if(!word) word = words.find(w => w.cells.includes(key));
    if(!word) return;
    state.activeWordId = word.id;
    state.cursorIndex = word.cells.indexOf(key);
    applyActiveWordHighlight();
    focusHiddenInput();
  }

  // Move to the next word (in grid order) that still has an empty cell.
  function advanceToNextWord(){
    const puzzle = getPuzzle();
    const words = computeWords(puzzle);
    if(!words.length) return;
    const grid = (state.room && state.room.grid) || {};
    const curIdx = words.findIndex(w => w.id === state.activeWordId);
    for(let step=1; step<=words.length; step++){
      const w = words[(curIdx + step) % words.length];
      const isFull = w.cells.every(k => grid[k]);
      if(!isFull){
        state.activeWordId = w.id;
        state.cursorIndex = firstEmptyIndex(w);
        return;
      }
    }
  }

  async function typeChar(ch){
    const word = getActiveWord();
    if(!word || state.cursorIndex >= word.cells.length) return;
    const key = word.cells[state.cursorIndex];
    try{
      state.room = await api('/api/rooms/' + state.code + '/cell', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ key, letter: ch, playerId: state.myId, color: state.myColor })
      });
      if(state.room.status === 'finished'){ state.screen = 'end'; render(); return; }
    }catch(e){ /* on retentera au prochain sondage */ }

    if(state.cursorIndex < word.cells.length - 1){
      state.cursorIndex += 1;
    } else {
      advanceToNextWord();
    }
    render();
  }

  async function doBackspace(){
    const word = getActiveWord();
    if(!word) return;
    let idx = state.cursorIndex;
    const grid = (state.room && state.room.grid) || {};
    // if current cell already empty, step back first
    if(idx > 0 && !grid[word.cells[idx]]) idx -= 1;
    const key = word.cells[idx];
    state.cursorIndex = idx;
    try{
      state.room = await api('/api/rooms/' + state.code + '/cell', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ key, letter: '', playerId: state.myId, color: state.myColor })
      });
    }catch(e){ /* on retentera au prochain sondage */ }
    render();
  }

  function applyActiveWordHighlight(){
    if(state.screen !== 'game') return;
    const word = getActiveWord();
    document.querySelectorAll('.cell.letter.active').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.cell.letter.current').forEach(el => el.classList.remove('current'));
    document.querySelectorAll('.cell.clue.active').forEach(el => el.classList.remove('active'));
    const banner = document.getElementById('clue-banner-text');
    if(word){
      word.cells.forEach((k, i) => {
        const el = document.querySelector('.cell.letter[data-key="'+k+'"]');
        if(el){
          el.classList.add('active');
          if(i === state.cursorIndex) el.classList.add('current');
        }
      });
      const clueEl = document.querySelector('.cell.clue[data-wordid="'+word.id+'"]');
      if(clueEl) clueEl.classList.add('active');
      if(banner) banner.textContent = (word.dir === 'right' ? '→ ' : '↓ ') + word.text;
    } else if(banner){
      banner.textContent = "Touchez une définition en jaune pour écrire le mot correspondant, lettre par lettre.";
    }
  }

  function elapsedSeconds(){
    if(!state.room || !state.room.startedAt) return 0;
    const end = state.room.status === 'finished' ? state.room.finishedAt : Date.now();
    return Math.max(0, Math.round((end - state.room.startedAt)/1000));
  }
  function fmtTime(sec){ const m = Math.floor(sec/60), s = sec%60; return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0'); }
  function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  function initials(name){ return (name||'?').trim().slice(0,2).toUpperCase(); }

  function render(){
    const wasTyping = document.activeElement && document.activeElement.id === 'cell-input';
    const app = document.getElementById('app');
    if(state.screen === 'home') app.innerHTML = renderHome();
    else if(state.screen === 'lobby') app.innerHTML = renderLobby();
    else if(state.screen === 'game') app.innerHTML = renderGame();
    else if(state.screen === 'end') app.innerHTML = renderEnd();
    attachHandlers();
    if(state.screen === 'game'){
      applyActiveWordHighlight();
      if(wasTyping) focusHiddenInput();
    }
  }

  function renderHome(){
    return `
      <div class="brand">
        <h1 class="display">Grille en Équipe</h1>
        <span class="tag">mots fléchés, à plusieurs</span>
      </div>
      <div class="card">
        <h2>Créer une partie</h2>
        <label class="small">Ton prénom</label>
        <input class="field" id="create-name" maxlength="16" placeholder="Ex. Léa">
        <button class="btn amber" id="btn-create" ${state.busy?'disabled':''}>Créer une salle</button>
      </div>
      <div class="divider">ou</div>
      <div class="card">
        <h2>Rejoindre une partie</h2>
        <label class="small">Code de la salle</label>
        <input class="field" id="join-code" maxlength="4" placeholder="Ex. FQXR" style="text-transform:uppercase; letter-spacing:0.15em; font-weight:700;">
        <label class="small">Ton prénom</label>
        <input class="field" id="join-name" maxlength="16" placeholder="Ex. Malik">
        <button class="btn secondary" id="btn-join" ${state.busy?'disabled':''}>Rejoindre</button>
        ${state.error ? `<p class="error-text">${escapeHtml(state.error)}</p>` : ''}
      </div>
      <p class="footer-note">Un joueur crée la salle depuis l'ordinateur qui fait tourner le serveur, les autres rejoignent depuis leur téléphone en tapant son adresse IP dans leur navigateur.</p>
    `;
  }

  function renderLobby(){
    const room = state.room;
    const players = room.players;
    const isHost = players.find(p => p.id === state.myId && p.host);
    const puzzle = getPuzzle();
    return `
      <div class="brand"><h1 class="display" style="font-size:22px;">Salle d'attente</h1></div>
      <p style="font-size:13px; color:var(--ink-soft); margin-bottom:2px;">Partage ce code avec ton équipe :</p>
      <div class="room-code">${room.code}</div>
      <p style="text-align:center; font-size:13px; color:var(--ink-soft); margin:-6px 0 14px;">Grille tirée au sort — thème : <strong style="color:var(--ink);">${escapeHtml(puzzle.theme || '—')}</strong></p>
      <div class="players-list">
        ${players.map(p => `
          <div class="player-row">
            <div class="avatar" style="background:${p.color}">${initials(p.name)}</div>
            <span>${escapeHtml(p.name)}</span>
            ${p.host ? '<span class="host-tag">hôte</span>' : ''}
          </div>
        `).join('')}
      </div>
      ${isHost
        ? `<button class="btn amber" id="btn-launch">Lancer la partie</button>`
        : `<p style="text-align:center; color:var(--ink-soft); font-size:13px;">En attente que l'hôte lance la partie…</p>`
      }
      <p class="footer-note">${players.length} joueur${players.length>1?'s':''} dans la salle</p>
    `;
  }

  function renderGame(){
    const room = state.room;
    const puzzle = getPuzzle();
    const gridMap = buildGridMap(puzzle);
    const grid = room.grid || {};
    const sec = elapsedSeconds();
    if(!state.activeWordId){
      const words = computeWords(puzzle);
      if(words.length){
        state.activeWordId = words[0].id;
        state.cursorIndex = firstEmptyIndex(words[0]);
      }
    }

    let cellsHtml = '';
    for(let r=0;r<puzzle.rows;r++){
      for(let c=0;c<puzzle.cols;c++){
        const key = r+'-'+c;
        const def = gridMap[key];
        if(def.type === 'black'){
          cellsHtml += `<div class="cell black"></div>`;
        } else if(def.type === 'clue'){
          const arrow = def.dir === 'right' ? '→' : '↓';
          cellsHtml += `<div class="cell clue" data-wordid="${key}"><span>${escapeHtml(def.text)}</span><span class="arrow">${arrow}</span></div>`;
        } else {
          const filled = grid[key];
          const isCorrect = filled && filled.letter === def.answer;
          cellsHtml += `
            <div class="cell letter ${isCorrect ? 'correct':''}" data-key="${key}">
              <span class="letter-text">${filled ? escapeHtml(filled.letter) : ''}</span>
              ${filled ? `<span class="dot" style="background:${filled.color}"></span>` : ''}
            </div>`;
        }
      }
    }

    return `
      <div class="topbar">
        <div class="stat"><div class="num">${fmtTime(sec)}</div><div class="lbl">temps</div></div>
        <div class="stat"><div class="num" style="font-size:15px;">${escapeHtml(puzzle.theme || '—')}</div><div class="lbl">thème</div></div>
        <div class="stat"><div class="num">${room.code}</div><div class="lbl">salle</div></div>
      </div>
      <div class="avatars-row">
        ${room.players.map(p => `<div class="avatar" style="background:${p.color}" title="${escapeHtml(p.name)}">${initials(p.name)}</div>`).join('')}
      </div>
      <div class="clue-banner"><span class="arrow">✎</span><span id="clue-banner-text">Touchez une définition en jaune pour écrire le mot correspondant, lettre par lettre.</span></div>
      <div class="grid-wrap">
        <div class="grid" style="grid-template-columns: repeat(${puzzle.cols}, 44px);">
          ${cellsHtml}
        </div>
      </div>
      <input id="cell-input" class="hidden-input" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <p class="footer-note">Touchez une case pour écrire — le clavier reste ouvert, les lettres s'enchaînent toutes seules.</p>
    `;
  }

  function renderEnd(){
    const room = state.room;
    return `
      <div class="brand"><h1 class="display" style="font-size:22px;">Bravo l'équipe !</h1></div>
      <div class="result">
        <p style="color:var(--ink-soft); font-size:14px;">Grille complétée en ${fmtTime(room.elapsed || elapsedSeconds())}</p>
        <div class="score">${room.score || 0}</div>
        <p style="color:var(--ink-soft); font-size:13px;">points d'équipe</p>
      </div>
      <div class="players-list">
        ${room.players.map(p => `
          <div class="player-row">
            <div class="avatar" style="background:${p.color}">${initials(p.name)}</div>
            <span>${escapeHtml(p.name)}</span>
          </div>
        `).join('')}
      </div>
      <button class="btn amber" id="btn-again">Rejouer dans cette salle</button>
      <p class="footer-note">Le code de salle ${room.code} reste valable pour une nouvelle partie.</p>
    `;
  }

  function attachHandlers(){
    const byId = id => document.getElementById(id);
    if(byId('btn-create')){
      byId('btn-create').addEventListener('click', () => {
        const name = byId('create-name').value.trim();
        if(!name){ shake('create-name'); return; }
        createRoom(name);
      });
    }
    if(byId('btn-join')){
      byId('btn-join').addEventListener('click', () => {
        const code = byId('join-code').value.trim();
        const name = byId('join-name').value.trim();
        if(!code || !name) return;
        joinRoom(code, name);
      });
    }
    if(byId('btn-launch')) byId('btn-launch').addEventListener('click', launchGame);
    if(byId('btn-again')) byId('btn-again').addEventListener('click', playAgain);
    document.querySelectorAll('.cell.clue[data-wordid]').forEach(el => {
      el.addEventListener('click', () => selectWord(el.getAttribute('data-wordid')));
    });
    document.querySelectorAll('.cell.letter[data-key]').forEach(el => {
      el.addEventListener('click', () => selectCell(el.getAttribute('data-key')));
    });
    const cellInput = byId('cell-input');
    if(cellInput){
      cellInput.addEventListener('input', (e) => {
        const inputType = e.inputType || '';
        if(inputType.indexOf('delete') !== -1){
          e.target.value = '';
          return;
        }
        const val = e.target.value;
        e.target.value = '';
        if(val){
          const ch = val.slice(-1).toUpperCase();
          typeChar(ch);
        }
      });
      cellInput.addEventListener('keydown', (e) => {
        if(e.key === 'Backspace'){
          e.preventDefault();
          doBackspace();
        }
      });
    }
  }

  function shake(id){
    const el = document.getElementById(id);
    if(!el) return;
    el.style.borderColor = 'var(--coral)';
    setTimeout(() => { el.style.borderColor = ''; }, 900);
  }

  render();
  ensurePuzzlesLoaded();
})();
</script>
</body>
</html>
